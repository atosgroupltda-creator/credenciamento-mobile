<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credenciamento</title>
  <style>
    :root {
      --red: #e60012;
      --green: #27a745;
      --bg: #ffffff;
      --text: #151515;
      --muted: #666;
      --soft-red: #fff1f2;
      --line: #e8e8e8;
      --yellow: #fff4cc;
      --yellow-line: #efd36b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: #eeeeee;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      box-shadow: 0 0 24px rgba(0,0,0,.08);
    }

    .status {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-size: 12px;
      font-weight: 700;
    }

    .topbar {
      height: 58px;
      display: grid;
      grid-template-columns: 32px 1fr;
      align-items: center;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .back {
      font-size: 25px;
    }

    .brand {
      color: var(--red);
      font-size: 21px;
      font-weight: 900;
      text-align: left;
    }

    .simulation {
      padding: 10px 14px;
      background: var(--yellow);
      border-bottom: 1px solid var(--yellow-line);
      color: #5e4a00;
      font-size: 10px;
      line-height: 1.4;
      text-align: center;
      font-weight: 700;
    }

    .content {
      padding: 22px 14px 28px;
    }

    .timer-wrap {
      text-align: center;
      margin-bottom: 22px;
    }

    .timer-label {
      display: block;
      color: var(--red);
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .timer {
      color: var(--red);
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .timer-sub {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .card {
      padding: 22px 18px 18px;
      border: 1px solid #dedede;
      border-radius: 13px;
      box-shadow: 0 3px 10px rgba(0,0,0,.04);
      text-align: center;
      background: #fff;
    }

    .check {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      margin: -41px auto 11px;
      border-radius: 50%;
      background: #e8f7e9;
      color: var(--green);
      border: 3px solid white;
      font-size: 21px;
      font-weight: 900;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 17px;
      line-height: 1.35;
      margin-bottom: 9px;
    }

    .desc {
      color: #555;
      font-size: 11px;
      line-height: 1.5;
    }

    .fee {
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      background: var(--soft-red);
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .fee span {
      font-size: 12px;
      color: #555;
    }

    .fee strong {
      color: var(--red);
      font-size: 21px;
    }

    .info {
      margin-top: 12px;
      padding: 12px 13px;
      border-radius: 10px;
      background: var(--soft-red);
      color: #333;
      font-size: 10px;
      line-height: 1.45;
      text-align: left;
    }

    .info strong {
      color: var(--red);
    }

    .button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 7px;
      padding: 16px;
      background: var(--red);
      color: white;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(230,0,18,.22);
      transition: .2s;
    }

    .button.green {
      background: var(--green);
      box-shadow: 0 8px 18px rgba(39,167,69,.22);
    }

    .lesson-note {
      margin-top: 14px;
      padding: 12px;
      border: 1px dashed #bbb;
      border-radius: 8px;
      color: #555;
      background: #fafafa;
      font-size: 10px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="status">
      <span>9:41</span>
      <span>▮▮ ◉ ▰</span>
    </div>

    <header class="topbar">
      <span class="back">‹</span>
      <div class="brand">Credenciamento</div>
    </header>

    <section class="content">
      <div class="timer-wrap">
        <span class="timer-label">Tempo restante</span>
        <div class="timer" id="timer">02:00</div>
        <span class="timer-sub">minutos</span>
      </div>

      <article class="card">
        <div class="check">✓</div>

        <h1>Efetue o pagamento da taxa para validar seu cadastro</h1>

        <p class="desc">
          Seu cadastro está quase concluído. Finalize a etapa abaixo para prosseguir.
        </p>

        <div class="fee">
          <span>Taxa antifraude</span>
          <strong>R$ 19,99</strong>
        </div>
      </article>

      <div class="info">
        A última etapa agora é a <strong>validação antifraude</strong> para concluir seu cadastro.
      </div>

      <button class="button" id="button" type="button">
        PAGAR TAXA ANTIFRAUDE
      </button>

    </section>
  </main>

  <script>
    const codigoFicticio = "00020101021226660014BR.GOV.BCB.PIX0119anti-fraude@jim.com0221Pagamento anti-fraude520400005303986540519.995802BR5925ATOS EDITORA E LIVRARIA O6009ITAMARAJU62290525QRCCbmIrg2D6kQPKBWSnpe46s6304CEAF";

    const button = document.getElementById("button");
    const timer = document.getElementById("timer");

    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(codigoFicticio);
      } catch (error) {
        const temp = document.createElement("textarea");
        temp.value = codigoFicticio;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
      }

      button.classList.add("green");
      button.textContent = "CHAVE COPIADA";

      setTimeout(() => {
        button.classList.remove("green");
        button.textContent = "PAGAR TAXA ANTIFRAUDE";
      }, 3000);
    });

    let remaining = 120;

    function updateTimer() {
      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;

      timer.textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

      if (remaining <= 0) {
        clearInterval(interval);
        return;
      }

      remaining--;
    }

    updateTimer();
    const interval = setInterval(updateTimer, 1000);
  </script>
</body>
</html>
