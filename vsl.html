<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Próxima etapa</title>
  <link rel="stylesheet" href="styles.css">

<body>
<main id="app">
  <header class="topbar">

  <div class="red-line"></div>

  <section class="vsl-page">

<script>
  const saved = localStorage.getItem("lead_first_name") || "Olá";
  document.getElementById("vslFirstName").textContent = saved;
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
</script>
