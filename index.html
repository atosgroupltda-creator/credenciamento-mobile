<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Veja como se tornar uma credenciada</title>
  <style>
    :root{
      --red:#ed1010;
      --ink:#101216;
      --panel:#1d2026;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      min-height:100%;
      background:#fff;
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
    }

    .funnel-start{
      width:min(100%,430px);
      min-height:100dvh;
      padding:38px 20px 28px;
      background:#fff;
    }

    .funnel-headline{
      max-width:390px;
      margin:0 auto 28px;
      text-align:center;
      font-size:29px;
      line-height:1.17;
      letter-spacing:-.7px;
      font-weight:850;
    }

    .funnel-headline .highlight{
      color:var(--red);
    }

    .video-entry{
      position:relative;
      width:100%;
      aspect-ratio:9/16;
      max-height:650px;
      border-radius:22px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:13px;
      color:#fff;
      background:
        radial-gradient(circle at 50% 45%,rgba(255,255,255,.035),transparent 35%),
        linear-gradient(145deg,#181b21,#24272e);
      box-shadow:0 15px 34px rgba(18,23,32,.16);
      text-align:center;
      text-decoration:none;
      overflow:hidden;
    }

    .play-button{
      width:76px;
      height:76px;
      border-radius:50%;
      display:grid;
      place-items:center;
      padding-left:5px;
      background:var(--red);
      box-shadow:0 12px 24px rgba(237,16,16,.3);
      font-size:31px;
    }

    .video-entry strong{
      margin-top:8px;
      font-size:18px;
    }

    .video-entry small{
      color:#d6dae2;
      font-size:13px;
    }

    @media(max-width:350px){
      .funnel-start{
        padding-left:14px;
        padding-right:14px;
      }

      .funnel-headline{
        font-size:25px;
      }
    }

    @media(min-width:520px){
      body{
        align-items:flex-start;
        background:#f3f4f6;
      }

      .funnel-start{
        margin:18px;
        border-radius:28px;
        box-shadow:0 18px 55px rgba(22,30,44,.12);
      }
    }
  </style>
</head>
<body>
  <main class="funnel-start">
    <h1 class="funnel-headline">
      Veja como se tornar uma credenciada a
      <span class="highlight">Ifood</span>
      e lucrar de
      <span class="highlight">50 a 70 reais por dia</span>
    </h1>

    <a class="video-entry" href="etapa1.html" aria-label="Assistir à VSL e continuar">
      <span class="play-button">▶</span>
      <strong>Assista ao vídeo abaixo</strong>
      <small>Toque para iniciar</small>
    </a>
  </main>
</body>
</html>
