<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Veja como se tornar uma credenciada</title>
  <style>
    :root{
      --red:#ed1010;
      --ink:#101216;
      --panel:#1d2026;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      min-height:100%;
      background:#fff;
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
    }

    .funnel-start{
      width:min(100%,430px);
      min-height:100dvh;
      padding:38px 20px 28px;
      background:#fff;
    }

    .funnel-headline{
      max-width:390px;
      margin:0 auto 28px;
      text-align:center;
      font-size:29px;
      line-height:1.17;
      letter-spacing:-.7px;
      font-weight:850;
    }

    .funnel-headline .highlight{
      color:var(--red);
    }
.delayed-button{
      width:100%;
      min-height:58px;
      margin-top:18px;
      padding:0 20px;
      border-radius:12px;
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      color:#fff;
      background:linear-gradient(145deg,#ed1010,#d40000);
      box-shadow:0 12px 25px rgba(212,0,0,.22);
      font-size:16px;
      font-weight:800;
      text-align:center;
      text-decoration:none;
      opacity:0;
      transform:translateY(12px);
    }

    .delayed-button.visible{
      display:flex;
      animation:showButton .42s ease forwards;
    }

    .delayed-button span{
      font-size:28px;
      line-height:1;
    }

    @keyframes showButton{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:350px){
      .funnel-start{
        padding-left:14px;
        padding-right:14px;
      }

      .funnel-headline{
        font-size:25px;
      }
    }

    @media(min-width:520px){
      body{
        align-items:flex-start;
        background:#f3f4f6;
      }

      .funnel-start{
        margin:18px;
        border-radius:28px;
        box-shadow:0 18px 55px rgba(22,30,44,.12);
      }
    }
  </style>
</head>
<body>
  <main class="funnel-start">
    <h1 class="funnel-headline">
      Veja como se tornar uma credenciada a
      <span class="highlight">Ifood</span>
      e lucrar de
      <span class="highlight">50 a 70 reais por dia</span>
    </h1>

    <div class="vsl-embed-wrapper">
      <vturb-smartplayer
        id="vid-6a73ab1f5c75cb7be4585335"
        style="display:block;margin:0 auto;width:100%;max-width:400px;">
        <div
          class="vturb-player-placeholder"
          style="position:relative;width:100%;padding:177.77777777777777% 0 0;z-index:0;background-color:black;">
        </div>
      </vturb-smartplayer>
    </div>

<a class="delayed-button" id="delayedButton" href="etapa1.html">
      Quero ser uma credenciada
      <span>→</span>
    </a>
  </main>


  <script type="text/javascript">
    var s = document.createElement("script");
    s.src = "https://scripts.converteai.net/80fce7f3-532f-451b-953f-9e75cc12be0e/players/6a73ab1f5c75cb7be4585335/v4/player.js";
    s.async = true;
    document.head.appendChild(s);
  </script>

  <script>
    // Tempo provisório para teste. Depois substitua 10 pelo tempo real em segundos.
    const buttonDelayInSeconds = 10;

    window.setTimeout(() => {
      document.getElementById("delayedButton").classList.add("visible");
    }, buttonDelayInSeconds * 1000);
  </script>

</body>
</html>
