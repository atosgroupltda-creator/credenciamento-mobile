<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Food Pago — Segunda VSL</title>
  <link rel="stylesheet" href="styles.css">

  <style>

    .vsl2-embed-wrapper{
      width:100%;
      margin:0 auto;
      border-radius:22px;
      overflow:hidden;
      background:#000;
      box-shadow:0 15px 34px rgba(18,23,32,.16);
    }

    .vsl2-embed-wrapper vturb-smartplayer{
      width:100% !important;
      max-width:400px !important;
    }

    .delayed-vsl2-button{
      display:none;
      opacity:0;
      transform:translateY(12px);
    }

    .delayed-vsl2-button.visible{
      display:flex;
      animation:showVsl2Button .42s ease forwards;
    }

    @keyframes showVsl2Button{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>

</head>
<body>
<main id="app">
  <header class="topbar">
    <a class="brand" href="etapa1.html"><span class="brand-main food-name">Food</span>
        <span class="brand-tag">PAGO</span></a>
    <div class="security-badge"><span class="security-icon">✓</span><span><strong>Ambiente protegido</strong><small>Página independente</small></span></div>
  </header>
  <div class="red-line"></div>

  <section class="vsl-page">
<div class="vsl-copy"><h1><span id="vslFirstName">Olá</span>, assista para solicitar corretamente seu crédito iFood.</h1><p>Assista ao vídeo até o final para entender como continuar sua solicitação.</p></div>

    <div class="vsl2-embed-wrapper">
      <vturb-smartplayer
        id="vid-6a7408528625a6ba000bb644"
        style="display:block;margin:0 auto;width:100%;max-width:400px;">
        <div
          class="vturb-player-placeholder"
          style="position:relative;width:100%;padding:177.77777777777777% 0 0;z-index:0;background-color:black;">
        </div>
      </vturb-smartplayer>
    </div>

<a class="primary-button link-button delayed-vsl2-button" id="vsl2DelayedButton" href="etapa2.html">CONTINUAR PARA SOLICITAR O CRÉDITO <span>→</span></a>
  </section>
</main>

<script type="text/javascript">
  var s = document.createElement("script");
  s.src = "https://scripts.converteai.net/80fce7f3-532f-451b-953f-9e75cc12be0e/players/6a7408528625a6ba000bb644/v4/player.js";
  s.async = true;
  document.head.appendChild(s);
</script>

<script>
    const savedName = sessionStorage.getItem("lead_first_name") || "Olá";
    document.getElementById("vslFirstName").textContent = savedName;

    // O botão aparece em 1 minuto e 29 segundos.
    const vsl2ButtonDelayInSeconds = 89;

    window.setTimeout(() => {
      document.getElementById("vsl2DelayedButton").classList.add("visible");
    }, vsl2ButtonDelayInSeconds * 1000);
  </script>
</body>
</html>
